<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Leva H3LL — social links">
  <title>Leva H3LL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#080808;--fg:#f5f5f5;--muted:#858585;--line:#242424;--surface:#0e0e0e}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Manrope, sans-serif;overflow-x:hidden}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;z-index:-1;background-image:radial-gradient(#fff .55px,transparent .55px);background-size:5px 5px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
    .shell{width:min(720px,calc(100% - 40px));margin:0 auto;padding:34px 0 30px}
    header{display:flex;align-items:center;justify-content:space-between;padding-bottom:17px;border-bottom:1px solid var(--line);animation:fade .8s both}
    .wordmark{font:500 10px 'DM Mono',monospace;letter-spacing:.2em;color:#aaa}
    .index{font:10px 'DM Mono',monospace;color:#666;letter-spacing:.12em}
    main{padding-top:105px}
    .eyebrow{font:10px 'DM Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#888;animation:up .7s .08s both}
    h1{font-size:clamp(58px,11vw,100px);letter-spacing:-.09em;line-height:.92;margin:22px 0 16px;font-weight:800;animation:up .8s .16s both}
    h1 span{color:#777}
    .subtitle{margin:0;color:#999;font-size:14px;line-height:1.7;animation:up .8s .24s both}
    .rule{height:1px;background:var(--line);margin:62px 0 18px}
    .label{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#777;font:10px 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase}
    .links{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .link{min-height:82px;display:flex;align-items:center;gap:15px;padding:16px 17px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);transition:background .35s,border-color .35s,transform .35s;opacity:0;animation:up .65s both}
    .link:nth-child(1){animation-delay:.32s}.link:nth-child(2){animation-delay:.4s}.link:nth-child(3){animation-delay:.48s}.link:nth-child(4){animation-delay:.56s}
    .link:hover{background:#151515;border-color:#777;transform:translateY(-3px)}
    .logo{width:25px;height:25px;object-fit:contain;filter:grayscale(1) brightness(0) invert(1);opacity:.9;flex:0 0 25px;transition:transform .35s}
    .link:hover .logo{transform:scale(1.12)}
    .meta{min-width:0}
    .meta strong{display:block;font-size:13px;font-weight:700;letter-spacing:.01em}
    .meta small{display:block;margin-top:4px;color:#777;font:10px 'DM Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .arrow{margin-left:auto;color:#666;font-size:16px;transition:transform .3s,color .3s}
    .link:hover .arrow{transform:translate(3px,-3px);color:#fff}
    .qr-area{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:20px 0 0}
    .qr-copy h2{margin:0 0 7px;font-size:16px;letter-spacing:-.04em}
    .qr-copy p{margin:0;color:#777;font-size:11px;line-height:1.65;max-width:280px}
    .qr-buttons{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    button{border:1px solid #3a3a3a;background:transparent;color:#eee;padding:9px 11px;font:9px 'DM Mono',monospace;letter-spacing:.08em;cursor:pointer;transition:background .25s,border-color .25s,transform .25s}
    button:hover{background:#fff;color:#080808;border-color:#fff;transform:translateY(-2px)}
    #qrcode{width:88px;height:88px;background:#fff;padding:6px;display:grid;place-items:center;flex:0 0 88px}
    #qrcode canvas,#qrcode img{width:100%!important;height:100%!important}
    footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:65px;padding-top:15px;color:#5f5f5f;font:9px 'DM Mono',monospace;letter-spacing:.12em}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media(max-width:520px){.shell{width:calc(100% - 30px);padding-top:23px}main{padding-top:82px}.links{grid-template-columns:1fr;gap:8px}.link{min-height:74px}.rule{margin-top:48px}.qr-area{align-items:flex-start}.qr-copy p{max-width:230px}#qrcode{width:76px;height:76px;flex-basis:76px}footer{margin-top:52px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="wordmark">LEVA H3LL / PERSONAL LINKS</div><div class="index">LINKS — 04</div></header>
    <main>
      <div class="eyebrow">A PLACE TO FIND ME</div>
      <h1>Leva <span>H3LL</span></h1>
      <p class="subtitle">Find me across the internet.</p>

      <div class="rule"></div>
      <div class="label"><span>Socials</span><span>01 — 04</span></div>
      <section class="links" id="links" aria-label="Social links"></section>

      <div class="rule"></div>
      <div class="label"><span>Share profile</span><span>QR / 01</span></div>
      <section class="qr-area">
        <div class="qr-copy">
          <h2>One link. Everything.</h2>
          <p>Scan to open this page and find all my profiles.</p>
          <div class="qr-buttons">
            <button id="downloadQr">DOWNLOAD QR</button>
            <button id="copyUrl">COPY LINK</button>
          </div>
        </div>
        <div id="qrcode" aria-label="QR code for this page"></div>
      </section>
    </main>
    <footer><span>© <span id="year"></span> LEVA H3LL</span><span>STAY CONNECTED</span></footer>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./config.js"></script>
  <script>
    const root=document.getElementById('links');
    const brandIcons={
      Telegram:'https://cdn.simpleicons.org/telegram/ffffff',
      GitHub:'https://cdn.simpleicons.org/github/ffffff',
      Spotify:'https://cdn.simpleicons.org/spotify/ffffff',
      Steam:'https://cdn.simpleicons.org/steam/ffffff'
    };
    (window.SOCIAL_LINKS||[]).forEach(item=>{
      const a=document.createElement('a');
      a.className='link';a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';
      const img=document.createElement('img');img.className='logo';img.alt='';img.src=brandIcons[item.name]||'';
      const meta=document.createElement('div');meta.className='meta';
      const title=document.createElement('strong');title.textContent=item.name;
      const detail=document.createElement('small');detail.textContent=item.handle;
      meta.append(title,detail);
      const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';
      a.append(img,meta,arrow);root.appendChild(a);
    });
    document.getElementById('year').textContent=new Date().getFullYear();
    const pageUrl=window.location.href.split('#')[0],qr=document.getElementById('qrcode');
    if(window.QRCode)new QRCode(qr,{text:pageUrl,width:200,height:200,colorDark:'#080808',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
    document.getElementById('downloadQr').addEventListener('click',()=>{
      const canvas=qr.querySelector('canvas'),img=qr.querySelector('img');
      const src=canvas?canvas.toDataURL('image/png'):(img?img.src:null);if(!src)return;
      const a=document.createElement('a');a.href=src;a.download='leva-h3ll-qr.png';a.click();
    });
    document.getElementById('copyUrl').addEventListener('click',async e=>{
      const b=e.currentTarget;try{await navigator.clipboard.writeText(pageUrl);b.textContent='COPIED ✓'}catch{b.textContent='COPY FAILED'}
      setTimeout(()=>b.textContent='COPY LINK',1600);
    });
  </script>
</body>
</html>
